<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>虚拟列表演练：10000 条数据只渲染可见行</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f6fa; color: #1f2937;
  }
  h3 { margin: 0 0 6px; font-size: 15px; }
  .stats { font-size: 12px; color: #64748b; margin: 0 0 10px; }
  .stats b { color: #2b7fff; }
  #scroller {
    height: 420px; overflow-y: auto;
    background: #fff; border: 1px solid #e3e8f0; border-radius: 12px;
  }
  .phantom { position: relative; }
  .row {
    position: absolute; left: 0; right: 0;
    display: flex; align-items: center; gap: 12px;
    height: 64px; padding: 0 16px;
    border-bottom: 1px solid #eef2f8;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; font-weight: 700;
  }
  .title { font-size: 14px; font-weight: 600; }
  .sub { font-size: 12px; color: #94a3b8; }
  .toggle { margin-bottom: 10px; }
  .toggle button {
    border: 1px solid #d4dce8; background: #fff; border-radius: 8px;
    padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
  <h3>虚拟长列表：10,000 条数据，DOM 中只保留可视区 + 缓冲行</h3>
  <div class="toggle">
    <button id="toggle">切换为普通渲染（观察卡顿）</button>
  </div>
  <p class="stats" id="stats"></p>
  <div id="scroller"><div class="phantom" id="phantom"></div></div>

<script>
/* ========= 核心参数（可修改后运行） ========= */
var TOTAL = 10000;      // 数据总量
var ROW_H = 64;         // 行高（uni-app 中建议固定行高）
var BUFFER = 4;         // 上下缓冲行数

var colors = ['#2b7fff', '#7b5cff', '#14b8a6', '#f59e0b', '#ef4444'];
var data = [];
for (var i = 0; i < TOTAL; i++) {
  data.push({ id: i + 1, title: '消息 #' + (i + 1), sub: '这是第 ' + (i + 1) + ' 条列表数据' });
}

var scroller = document.getElementById('scroller');
var phantom = document.getElementById('phantom');
var stats = document.getElementById('stats');
var virtual = true;

function renderVirtual() {
  var scrollTop = scroller.scrollTop;
  var viewH = scroller.clientHeight;
  var start = Math.max(0, Math.floor(scrollTop / ROW_H) - BUFFER);
  var visibleCount = Math.ceil(viewH / ROW_H) + BUFFER * 2;
  var end = Math.min(TOTAL, start + visibleCount);

  var html = '';
  for (var i = start; i < end; i++) {
    var item = data[i];
    html += '<div class="row" style="top:' + (i * ROW_H) + 'px">' +
      '<div class="avatar" style="background:' + colors[i % colors.length] + '">' + (i % 9 + 1) + '</div>' +
      '<div><div class="title">' + item.title + '</div><div class="sub">' + item.sub + '</div></div></div>';
  }
  phantom.style.height = TOTAL * ROW_H + 'px';
  phantom.innerHTML = html;
  stats.innerHTML = '虚拟模式：共 <b>' + TOTAL + '</b> 条，当前 DOM 行节点 <b>' +
    (end - start) + '</b> 个，滚动位置 ' + Math.round(scrollTop) + 'px';
}

function renderAll() {
  var html = '';
  for (var i = 0; i < TOTAL; i++) {
    html += '<div class="row" style="position:relative"><div class="avatar" style="background:' +
      colors[i % colors.length] + '">' + (i % 9 + 1) + '</div><div><div class="title">' +
      data[i].title + '</div><div class="sub">' + data[i].sub + '</div></div></div>';
  }
  phantom.style.height = 'auto';
  phantom.innerHTML = html;
  stats.innerHTML = '普通模式：DOM 行节点 <b>' + TOTAL + '</b> 个，快速滚动可明显感到掉帧';
}

scroller.addEventListener('scroll', function () {
  if (virtual) requestAnimationFrame(renderVirtual);
});
document.getElementById('toggle').onclick = function (e) {
  virtual = !virtual;
  e.target.textContent = virtual ? '切换为普通渲染（观察卡顿）' : '切换回虚拟列表';
  scroller.scrollTop = 0;
  if (virtual) renderVirtual(); else renderAll();
};
renderVirtual();
</script>
</body>
</html>

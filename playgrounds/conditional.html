<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>条件编译演练：同一套代码，四端不同产物</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f6fa; color: #1f2937;
  }
  h3 { margin: 0 0 10px; font-size: 15px; }
  .switches { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .switches button {
    border: 1px solid #d4dce8; background: #fff; border-radius: 999px;
    padding: 7px 18px; font-size: 13px; cursor: pointer;
  }
  .switches button.active { background: #2b7fff; border-color: #2b7fff; color: #fff; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .preview, .code {
    background: #fff; border: 1px solid #e3e8f0; border-radius: 12px;
    padding: 14px; min-height: 260px;
  }
  .preview h4, .code h4 { margin: 0 0 10px; font-size: 13px; color: #64748b; }
  .phone {
    width: 100%; max-width: 230px; margin: 0 auto;
    border: 6px solid #1f2937; border-radius: 26px; overflow: hidden;
  }
  .statusbar { height: 22px; background: #1f2937; color: #cbd5e1; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .screen { padding: 16px; min-height: 180px; font-size: 13px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; color: #fff; margin-bottom: 10px; }
  .feature { padding: 8px 10px; border-radius: 8px; background: #f1f5f9; margin-bottom: 8px; font-size: 12px; }
  pre { margin: 0; font-size: 11.5px; line-height: 1.6; color: #334155; white-space: pre-wrap; }
  .cm { color: #94a3b8; } .kw { color: #7c3aed; font-weight: 700; }
  @media (max-width: 560px) { .stage { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h3>条件编译：切换“目标平台”，观察被保留 / 剔除的代码与 UI</h3>
  <div class="switches" id="switches">
    <button data-platform="h5" class="active">H5</button>
    <button data-platform="mp-weixin">微信小程序</button>
    <button data-platform="app">App（iOS/Android）</button>
  </div>
  <div class="stage">
    <div class="preview">
      <h4>产物预览</h4>
      <div class="phone">
        <div class="statusbar" id="statusbar">9:41 · uni-app</div>
        <div class="screen" id="screen"></div>
      </div>
    </div>
    <div class="code">
      <h4>编译后保留的分支（对应 #ifdef 条件）</h4>
      <pre id="codetree"></pre>
    </div>
  </div>

<script>
/* ===== 模拟各平台在条件编译下“保留的能力”（可修改后运行） ===== */
var platforms = {
  h5: {
    color: '#2b7fff',
    features: [
      { title: '网页分享', desc: '调用浏览器 navigator.share / 复制链接' },
      { title: '扫码', desc: 'H5 降级为 <input type=file> 上传识别' }
    ],
    kept: ['// #ifdef H5', 'shareViaBrowser()', '// #endif']
  },
  'mp-weixin': {
    color: '#07c160',
    features: [
      { title: '小程序分享', desc: 'onShareAppMessage 转发到聊天' },
      { title: '扫码', desc: 'uni.scanCode 原生能力' }
    ],
    kept: ['// #ifdef MP-WEIXIN', 'onShareAppMessage()', 'uni.scanCode()', '// #endif']
  },
  app: {
    color: '#f59e0b',
    features: [
      { title: '原生分享', desc: 'uni.share 调起微信/系统分享面板' },
      { title: '扫码', desc: 'uni.scanCode 原生能力' },
      { title: '推送', desc: 'UniPush 在线/离线通知' }
    ],
    kept: ['// #ifdef APP-PLUS', 'uni.share()', 'uni.scanCode()', 'UniPush.init()', '// #endif']
  }
};

var current = 'h5';
function render() {
  var p = platforms[current];
  document.getElementById('statusbar').textContent =
    '9:41 · ' + (current === 'h5' ? 'H5 浏览器' : current === 'app' ? 'App' : '微信小程序');
  document.getElementById('screen').innerHTML =
    '<span class="badge" style="background:' + p.color + '">' + current + ' 产物</span>' +
    p.features.map(function (f) {
      return '<div class="feature"><b>' + f.title + '</b><br>' + f.desc + '</div>';
    }).join('');
  document.getElementById('codetree').innerHTML = p.kept.map(function (line, i) {
    var cls = line.indexOf('#') === 0 ? 'cm' : (line.indexOf('(') > -1 ? 'kw' : '');
    return '<span class="' + cls + '">' + line + '</span>';
  }).join('\n');
}
document.getElementById('switches').addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  current = btn.dataset.platform;
  document.querySelectorAll('.switches button').forEach(function (b) {
    b.classList.toggle('active', b === btn);
  });
  render();
});
render();
</script>
</body>
</html>
